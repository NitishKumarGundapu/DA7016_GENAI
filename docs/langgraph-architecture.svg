<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Assessment LangGraph architecture</title>
  <desc id="desc">Top-level assessment pipeline plus the per-question grade, verify, and finalize subgraph.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a8f7a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#203d36" flood-opacity="0.07"/>
    </filter>
    <style>
      .sans { font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Bitstream Charter", Georgia, serif; }
      .node-title { font-size: 15px; font-weight: 650; fill: #203d36; text-anchor: middle; }
      .node-sub { font-size: 10.5px; fill: #5f7067; text-anchor: middle; }
      .step { font-size: 13px; font-weight: 650; text-anchor: middle; }
      .panel-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #71826a; }
      .edge-label { font-size: 11px; fill: #66735f; text-anchor: middle; paint-order: stroke; stroke: #fcfdf9; stroke-width: 4; stroke-linejoin: round; }
      .edge { fill: none; stroke: #7a8f7a; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #7a8f7a; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .legend { font-size: 11px; fill: #66735f; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#fbfaf6"/>

  <text x="40" y="52" class="serif" font-size="30" font-weight="700" fill="#203d36">Auto-Assessment</text>
  <text x="40" y="78" class="sans" font-size="14" fill="#66735f">LangGraph workflow · generated from auto_assessment/graph.py</text>

  <rect x="1320" y="32" width="240" height="36" rx="18" fill="#e8f0e9" stroke="#cfdcc9"/>
  <text x="1440" y="55" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#235b4c" text-anchor="middle">AI ASSISTS · JUDGMENT LEADS</text>

  <!-- ===================================================== top-level pipeline -->
  <rect x="40" y="110" width="1520" height="250" rx="20" fill="#ffffff" stroke="#e7e8e0" filter="url(#shadow)"/>
  <text x="70" y="150" class="sans panel-title">ASSESSMENT PIPELINE</text>
  <text x="1530" y="150" class="sans" font-size="11" fill="#8b9488" text-anchor="end">top-level graph</text>

  <!-- START -->
  <rect x="70" y="195" width="150" height="78" rx="39" fill="#235b4c" filter="url(#shadow)"/>
  <text x="145" y="239" class="sans step" fill="#ffffff" letter-spacing="1.5">START</text>

  <rect x="257" y="195" width="150" height="78" rx="14" fill="#eef5ea" stroke="#cfdcc9"/>
  <text x="332" y="228" class="sans node-title">ingest</text>
  <text x="332" y="250" class="sans node-sub">text + OCR</text>

  <rect x="444" y="195" width="150" height="78" rx="14" fill="#eef5ea" stroke="#cfdcc9"/>
  <text x="519" y="228" class="sans node-title">parse_spec</text>
  <text x="519" y="250" class="sans node-sub">align references</text>

  <rect x="631" y="195" width="150" height="78" rx="14" fill="#eef5ea" stroke="#cfdcc9"/>
  <text x="706" y="228" class="sans node-title">clean_align</text>
  <text x="706" y="250" class="sans node-sub">segment answers</text>

  <rect x="818" y="195" width="150" height="78" rx="14" fill="#f5edda" stroke="#b89e5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="893" y="228" class="sans node-title">grade_question</text>
  <text x="893" y="250" class="sans node-sub">per-question loop</text>

  <rect x="1005" y="195" width="150" height="78" rx="14" fill="#eef5ea" stroke="#cfdcc9"/>
  <text x="1080" y="228" class="sans node-title">aggregate</text>
  <text x="1080" y="250" class="sans node-sub">totals in code</text>

  <rect x="1192" y="195" width="150" height="78" rx="14" fill="#eef5ea" stroke="#cfdcc9"/>
  <text x="1267" y="228" class="sans node-title">report</text>
  <text x="1267" y="250" class="sans node-sub">feedback + Markdown</text>

  <rect x="1379" y="195" width="150" height="78" rx="39" fill="#235b4c" filter="url(#shadow)"/>
  <text x="1454" y="239" class="sans step" fill="#ffffff" letter-spacing="1.5">END</text>

  <!-- pipeline edges -->
  <path class="edge" d="M220 234 H250"/>
  <path class="edge" d="M407 234 H437"/>
  <path class="edge" d="M594 234 H624"/>
  <path class="edge" d="M781 234 H811"/>
  <path class="edge" d="M968 234 H998"/>
  <path class="edge" d="M1155 234 H1185"/>
  <path class="edge" d="M1342 234 H1372"/>

  <text x="70" y="340" class="sans" font-size="11" fill="#8b9488">Each box is a LangGraph node; edges run in paper order.</text>
  <text x="1530" y="340" class="sans" font-size="11" fill="#8b9488" text-anchor="end">build_graph()</text>

  <!-- connector from the per-question node to its detail panel -->
  <path d="M893 273 V412" fill="none" stroke="#b89e5e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="905" y="348" class="sans edge-label" fill="#9d7c31">expands below</text>

  <!-- ===================================================== per-question subgraph -->
  <rect x="40" y="420" width="1520" height="470" rx="20" fill="#fcfdf9" stroke="#e7e8e0"/>
  <text x="70" y="458" class="sans panel-title">PER-QUESTION SUBGRAPH</text>
  <text x="1530" y="458" class="sans" font-size="11" fill="#8b9488" text-anchor="end">invoked once per question</text>

  <!-- START -->
  <rect x="70" y="560" width="90" height="50" rx="25" fill="#235b4c"/>
  <text x="115" y="590" class="sans step" fill="#ffffff" letter-spacing="1.2">START</text>

  <!-- attempted? -->
  <polygon points="300,535 385,585 300,635 215,585" fill="#f7f9f3" stroke="#7a8f7a" stroke-width="1.5"/>
  <text x="300" y="580" class="sans" font-size="13" font-weight="650" fill="#203d36" text-anchor="middle">attempted?</text>
  <text x="300" y="599" class="sans" font-size="10" fill="#66735f" text-anchor="middle">from alignment</text>

  <!-- grade -->
  <rect x="430" y="550" width="160" height="70" rx="14" fill="#f5edda" stroke="#b89e5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="579" class="sans node-title">grade</text>
  <text x="510" y="600" class="sans node-sub">propose marks + evidence</text>

  <!-- verify -->
  <rect x="640" y="550" width="160" height="70" rx="14" fill="#eef5ea" stroke="#cfdcc9" filter="url(#shadow)"/>
  <text x="720" y="579" class="sans node-title">verify</text>
  <text x="720" y="600" class="sans node-sub">checks + optional critic</text>

  <!-- issues? -->
  <polygon points="940,535 1040,585 940,635 840,585" fill="#f7f9f3" stroke="#7a8f7a" stroke-width="1.5"/>
  <text x="940" y="580" class="sans" font-size="13" font-weight="650" fill="#203d36" text-anchor="middle">issues?</text>
  <text x="940" y="599" class="sans" font-size="10" fill="#66735f" text-anchor="middle">retries left?</text>

  <!-- finalize -->
  <rect x="1090" y="550" width="160" height="70" rx="14" fill="#eef5ea" stroke="#cfdcc9" filter="url(#shadow)"/>
  <text x="1170" y="579" class="sans node-title">finalize</text>
  <text x="1170" y="600" class="sans node-sub">clamp + attach evidence</text>

  <!-- END -->
  <rect x="1300" y="560" width="100" height="50" rx="25" fill="#235b4c"/>
  <text x="1350" y="590" class="sans step" fill="#ffffff" letter-spacing="1.2">END</text>

  <!-- skip -->
  <rect x="215" y="720" width="170" height="66" rx="14" fill="#fff8ec" stroke="#ead8b8" stroke-width="1.5"/>
  <text x="300" y="748" class="sans node-title">skip</text>
  <text x="300" y="767" class="sans node-sub">zero marks</text>

  <!-- main edges -->
  <path class="edge" d="M160 585 H208"/>
  <path class="edge-dashed" d="M385 585 H423"/>
  <text x="404" y="573" class="sans edge-label">yes</text>

  <path class="edge" d="M590 585 H633"/>
  <path class="edge" d="M800 585 H833"/>

  <path class="edge-dashed" d="M1040 585 H1083"/>
  <text x="1062" y="573" class="sans edge-label">no</text>

  <path class="edge" d="M1250 585 H1293"/>

  <!-- retry loop -->
  <path class="edge-dashed" d="M940 535 C940 490 510 490 510 545"/>
  <text x="725" y="497" class="sans edge-label" fill="#9d7c31">yes · retry up to MAX_GRADE_RETRIES</text>

  <!-- unattempted branch -->
  <path class="edge-dashed" d="M300 635 V713"/>
  <text x="312" y="681" class="sans edge-label" text-anchor="start">no</text>

  <path class="edge-dashed" d="M385 753 H1350 V617"/>
  <text x="860" y="744" class="sans edge-label">not attempted → zero marks, no LLM call</text>

  <!-- legend -->
  <line x1="70" y1="845" x2="110" y2="845" stroke="#7a8f7a" stroke-width="2"/>
  <text x="120" y="849" class="sans legend">main flow</text>

  <line x1="240" y1="845" x2="280" y2="845" stroke="#7a8f7a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="290" y="849" class="sans legend">conditional / retry</text>

  <text x="1530" y="849" class="sans legend" text-anchor="end">Totals and percentages are computed in code.</text>

  <!-- footer -->
  <text x="40" y="934" class="sans" font-size="10.5" fill="#98a08f">Generated from auto_assessment/graph.py</text>
  <text x="1560" y="934" class="sans" font-size="10.5" fill="#98a08f" text-anchor="end">AI assists. Your judgment leads.</text>
</svg>
